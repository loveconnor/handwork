[workspace]
resolver = "2"
default-members = ["crates/mobile-link"]
members = ["src-tauri", "crates/mobile-link"]
exclude = ["vendor/portable-pty"]

[workspace.package]
version = "0.1.8"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
